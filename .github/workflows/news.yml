name: NEWSKEYBAR News Bot

on:
workflow_dispatch:
schedule:
- cron: "17,47 * * * *"

permissions:
contents: write

concurrency:
group: newskeybar-bot
cancel-in-progress: false

jobs:
publish-news:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: python -m pip install requests feedparser

  - name: Run news bot
    env:
      RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
      RUBIKA_CHAT_ID: "@newskeybar"
    run: python news.py

  - name: Save duplicate protection state
    run: |
      if [ -f posted.json ]; then
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add posted.json
        git diff --cached --quiet || git commit -m "Update news history"
        git push
      fi
```
